name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Checar sintaxe dos arquivos do backend
        working-directory: backend
        run: |
          node --check server.js
          find routes middleware utils -name "*.js" -exec node --check {} \;

      - name: Checar sintaxe dos arquivos do frontend
        run: |
          find frontend/js -maxdepth 1 -name "*.js" -exec node --check {} \;

      - name: Subir servidor e checar health-check
        working-directory: backend
        run: |
          node server.js &
          sleep 2
          curl -sf http://localhost:3001/api/health
